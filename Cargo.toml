[package]
name = "livepaint"
version = "0.1.0"
edition = "2024"
description = "A lightweight live screen annotation overlay for Hyprland"
license = "MIT"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
calloop = "0.14"
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.33", default-features = false }
libc = "0.2"
pollster = "0.4"
raw-window-handle = "0.6"
serde_json = "1"
smithay-client-toolkit = "0.21"
wayland-client = { version = "0.31", features = ["system"] }
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
